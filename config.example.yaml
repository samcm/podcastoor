server:
  host: 0.0.0.0
  port: 3729
  publicBaseUrl: http://localhost:3729
storage:
  dataDir: ./data
processing:
  lookbackDays: 7
  maxEpisodesPerRun: 20
  concurrency: 1
  dryRun: false
  downloadAudio: true
  force: false
  confidenceThreshold: 0.72
  preserveUnknownSegments: true
automation:
  enabled: true
  processOnStartup: true
  intervalMinutes: 60
retry:
  maxAttempts: 3
  retryDelayMinutes: 60
admin:
  token: ""
costs:
  monthlyBudgetUsd: 50
  perRunBudgetUsd: 1
  transcribeMaxMinutesPerRun: 180
  llmMaxInputTokensPerRun: 250000
  llmMaxOutputTokensPerRun: 20000
audio:
  outputBitrateKbps: 192
  preserveSourceQuality: true
  jingle:
    enabled: true
    frequencyHz: 880
    durationSeconds: 0.35
    gainDb: -12
artwork:
  enabled: true
  model: google/gemini-3.1-flash-image-preview
  stampText: AD-FREE
  imageSize: 1K
transcripts:
  preferred: openRouter
  providers:
    feed:
      enabled: true
    pocketCasts:
      enabled: false
      experimental: true
      endpointTemplate: ""
    openRouter:
      enabled: true
      mode: audioChat
      model: xiaomi/mimo-v2-omni
      language: en
      chunkSeconds: 180
      concurrency: 1
      estimatedCostPerMinuteUsd: 0.0013
    openai:
      enabled: false
      model: gpt-4o-mini-transcribe
      estimatedCostPerMinuteUsd: 0.003
alignment:
  enabled: true
  provider: auto
  model: elevenlabs-forced-alignment
  estimatedCostPerMinuteUsd: 0.003667
  requireProvider: false
llm:
  provider: openrouter
  enabled: true
  model: qwen/qwen3.6-flash
  estimatedInputUsdPerMillion: 0.25
  estimatedOutputUsdPerMillion: 1.5
  maxTranscriptChars: 180000
detection:
  paddingSeconds: 0.6
  prePaddingSeconds: 0
  postPaddingSeconds: 0.4
  minSegmentSeconds: 8
  maxSegmentSeconds: 240
categories:
  preferred: []
  muted: []
podcasts: {}
